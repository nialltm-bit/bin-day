name: Probe all house-number councils

on:
  workflow_dispatch:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/batch-probe.yml
      - scripts/batch_probe.py

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Start a Chrome service for councils that need a browser
        run: docker run -d --name selenium -p 4444:4444 --shm-size=2g selenium/standalone-chrome:latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uk_bin_collection==0.173.5
      - run: curl -fsSL -o "$RUNNER_TEMP/input.json" https://raw.githubusercontent.com/robbrad/UKBinCollectionData/0.173.5/uk_bin_collection/tests/input.json
      - name: Treat UPRN councils that can search by postcode and house number as such
        run: |
          python scripts/without_uprn.py "$RUNNER_TEMP/input.json" "$(python -c 'import importlib.util as u; print(list(u.find_spec("uk_bin_collection.uk_bin_collection.councils").submodule_search_locations)[0])')" "$RUNNER_TEMP/input.json"
      - name: Wait for the Chrome service
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:4444/status | grep -q '"ready": *true' && exit 0
            sleep 2
          done
          echo "Chrome service not ready" >&2; exit 1
      - name: Probe each council, one request at a time
        run: python scripts/batch_probe.py "$RUNNER_TEMP/input.json" docs/spike-results/full-suite.json docs/spike-results/batch-probe.json 10 http://localhost:4444
      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/spike-results/batch-probe.json
          git commit -m "Add the house-number council batch probe results [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
