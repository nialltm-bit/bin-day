name: Probe a council module

on:
  workflow_dispatch:
    inputs:
      module:
        description: UKBinCollectionData module name, for example NewcastleCityCouncil
        required: true
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/probe-council.yml
      - scripts/probe_council.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODULE: ${{ github.event.inputs.module || 'NewcastleCityCouncil' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uk_bin_collection==0.173.5
      - run: curl -fsSL -o input.json https://raw.githubusercontent.com/robbrad/UKBinCollectionData/0.173.5/uk_bin_collection/tests/input.json
      - name: Uses a browser?
        run: |
          f=$(python -c "import uk_bin_collection.uk_bin_collection.councils.$MODULE as m; print(m.__file__)")
          grep -c -i "selenium\|webdriver" "$f" || true
      - name: Run it once
        run: python scripts/probe_council.py input.json "$MODULE"
