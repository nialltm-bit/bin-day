name: Spike council address lookup

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-address.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the address lookup in the B&NES page scripts
        run: |
          UA="Mozilla/5.0 (compatible; bin-day-spike; +https://github.com/nialltm-bit/bin-day)"
          B=https://www.bathnes.gov.uk/webforms/waste/collectionday
          for f in js/collectionday.js config/collectionday_config.js config/collectionday_configLive.js; do
            echo "--- $f"
            curl -sSL -m 30 -A "$UA" -w "status %{http_code}\n" -o f.js "$B/$f"
            grep -o -i "[^\"' ]*\(api\|address\|postcode\|uprn\|search\)[^\"' ]*" f.js | sort -u | head -40
            sleep 5
          done
