name: Spike council address lookup

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-address.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the B&NES collection day page
        run: |
          UA="Mozilla/5.0 (compatible; bin-day-spike; +https://github.com/nialltm-bit/bin-day)"
          curl -sSL -m 30 -A "$UA" https://www.bathnes.gov.uk/webforms/waste/collectionday/ | grep -v '^\s*$' | sed -n '1,400p' | cut -c1-220
