name: Spike council address lookup

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-address.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the postcode lookup scripts on the B&NES site
        run: |
          UA="Mozilla/5.0 (compatible; bin-day-spike; +https://github.com/nialltm-bit/bin-day)"
          W=https://www.bathnes.gov.uk/webforms
          for f in waste/collectionday/modules/addressDetailsPC.js CommonFiles/modules/PostcodeLookup/PostcodeLookupCommon.js; do
            echo "--- $f"
            curl -sSL -m 30 -A "$UA" -w "status %{http_code}\n" -o f.js "$W/$f"
            grep -n -i "url\|http\|api\|ajax\|get(\|fetch\|getJSON" f.js | cut -c1-200 | head -40
            sleep 5
          done
          echo "--- config"
          curl -sSL -m 30 -A "$UA" $W/waste/collectionday/js/collectionday.js | grep -n -i "APIroot\|config" | cut -c1-200 | head
