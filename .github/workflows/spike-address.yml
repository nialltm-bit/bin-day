name: Spike council address lookup

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-address.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the address search settings and try one search
        run: |
          UA="Mozilla/5.0 (compatible; bin-day-spike; +https://github.com/nialltm-bit/bin-day)"
          W=https://www.bathnes.gov.uk/webforms
          curl -sSL -m 30 -A "$UA" -o p.js $W/CommonFiles/modules/PostcodeLookup/PostcodeLookupCommon.js
          echo "--- search code"; sed -n '60,130p' p.js | cut -c1-180
          sleep 5
          echo "--- settings"
          for f in $W/CommonFiles/js/commonFunctions.js $W/waste/collectionday/js/collectionday.js; do
            curl -sSL -m 30 -A "$UA" $f | grep -n -i "APIroot *=\|AddressesAPI *=\|BinsAPI *=\|searchType\|resultSize" | cut -c1-200 | head -12
            sleep 5
          done
