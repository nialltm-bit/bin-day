name: Fetch (scheduled)

# Fetches every address that is due today from the private Google Sheet store and saves the results back.
# The store steps do nothing until the BIN_DAY_STORE_URL and BIN_DAY_STORE_SECRET repository secrets exist (see docs/store.md).
# The test-address step needs no secrets, so frequency learning runs regardless.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Fetch every address even if it is not due (use sparingly)
        type: boolean
        default: false
      add_uprn:
        description: Optional. Add this UPRN to the store before fetching. Only for public test addresses such as 100120000855, because workflow inputs are visible on this public repo
        type: string
        default: ""
      add_ons:
        description: ONS code for the UPRN above
        type: string
        default: E06000022

permissions:
  contents: write  # only to save learned bin frequencies (council codes, bin names, counts and dates for public test addresses; no user addresses)

concurrency:
  group: fetch-scheduled
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # the Sunday run fetches every next_only address; GitHub allows up to 6 hours
    env:
      BIN_DAY_STORE_URL: ${{ secrets.BIN_DAY_STORE_URL }}
      BIN_DAY_STORE_SECRET: ${{ secrets.BIN_DAY_STORE_SECRET }}
    steps:
      - name: Check the store is configured
        id: config
        run: |
          if [ -z "$BIN_DAY_STORE_URL" ] || [ -z "$BIN_DAY_STORE_SECRET" ]; then
            echo "::notice::Store secrets are not set, so there is nothing to fetch. See docs/store.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
      - name: Start a Chrome service for councils that need a browser
        run: docker run -d --name selenium -p 4444:4444 --shm-size=2g selenium/standalone-chrome:latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r fetcher/requirements.txt
      - name: Wait for the Chrome service
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:4444/status | grep -q '"ready": *true' && exit 0
            sleep 2
          done
          echo "Chrome service not ready" >&2; exit 1
      - name: Add the address, if one was given
        if: steps.config.outputs.configured == 'true' && inputs.add_uprn != ''
        env:
          ADD_UPRN: ${{ inputs.add_uprn }}
          ADD_ONS: ${{ inputs.add_ons }}
        run: python -m fetcher.run add --sheet --ons "$ADD_ONS" --uprn "$ADD_UPRN"
      - name: Fetch due addresses
        if: steps.config.outputs.configured == 'true'
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: python -m fetcher.run fetch --sheet --selenium-url http://localhost:4444 $FORCE
      - name: Fetch each next_only council's public test address, to learn bin frequencies
        # Needs no store: these are upstream's public test addresses, one call per council per week, so learning
        # starts before anyone subscribes. See fetcher/testaddress.py.
        if: always()
        run: python -m fetcher.run test-addresses --selenium-url http://localhost:4444
      - name: Delete feeds nobody has used for a year, with their addresses
        if: steps.config.outputs.configured == 'true' && always()
        run: python -m fetcher.run expire --sheet --days 365
      - name: Save learned bin frequencies
        if: always()
        run: |
          git add registry/learned-frequencies.json registry/test-address-observations.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update learned bin frequencies [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
