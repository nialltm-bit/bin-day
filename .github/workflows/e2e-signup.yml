name: End-to-end sign-up test

# Signs up upstream's public Newcastle test address through the live script (the same call the website makes), waits for
# the fetch the sign-up asks for, and checks the dates and the calendar feed. The script address is read from the deployed
# page and the feed token is masked, so neither appears in this public log. Only the public test address is used.
on:
  workflow_dispatch:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/e2e-signup.yml

permissions:
  contents: read

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sign up, wait for the dates, read the feed
        run: |
          set -u
          BASE="https://${GITHUB_REPOSITORY_OWNER}.github.io/bin-day"
          curl -sSL -m 30 -o index.html "$BASE/"
          JS=$(grep -o 'assets/main-[^"]*\.js' index.html | head -1)
          curl -sSL -m 30 -o main.js "$BASE/$JS"
          SCRIPT=$(grep -o 'https://script.google.com/macros/s/[A-Za-z0-9_-]*/exec' main.js | head -1)
          if [ -z "$SCRIPT" ]; then echo "The deployed page has no script address built in"; exit 1; fi
          echo "::add-mask::$SCRIPT"
          echo "script address found on the deployed page"

          BODY='{"action":"subscribe","ons_code":"E08000021","postcode":"NE3 4XE","house_number":"1 Northumberland Avenue","garden":false}'
          REPLY=$(curl -sSL -m 90 -H 'Content-Type: text/plain;charset=utf-8' -d "$BODY" "$SCRIPT")
          case "$REPLY" in "{"*) ;; *) echo "not a JSON reply, starts: $(printf '%s' "$REPLY" | tr -d '\n' | cut -c1-120)"; exit 1;; esac
          TOKEN=$(printf '%s' "$REPLY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("token","")) if d.get("ok") else print("")')
          if [ -z "$TOKEN" ]; then
            echo "sign-up failed: $(printf '%s' "$REPLY" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("error","unexpected reply"))' 2>/dev/null || echo 'unreadable reply')"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "sign-up accepted"

          status=pending
          for i in $(seq 1 60); do
            UP=$(curl -sSL -m 90 -H 'Content-Type: text/plain;charset=utf-8' -d "{\"action\":\"upcoming\",\"token\":\"$TOKEN\"}" "$SCRIPT")
            status=$(printf '%s' "$UP" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","?"))' 2>/dev/null || echo '?')
            echo "poll $i: $status"
            [ "$status" = ready ] || [ "$status" = failed ] && break
            sleep 10
          done
          printf '%s' "$UP" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          for c in d.get("collections",[]): print(" ", c["date"], c["label"], "(projected)" if c.get("projected") else "")'
          FEED=$(curl -sSL -m 60 "$SCRIPT?feed=$TOKEN")
          echo "feed starts with VCALENDAR: $(printf '%s' "$FEED" | head -1 | grep -c BEGIN:VCALENDAR)"
          echo "feed events: $(printf '%s' "$FEED" | grep -c BEGIN:VEVENT)"
          [ "$status" = ready ]
