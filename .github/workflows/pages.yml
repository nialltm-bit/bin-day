name: Deploy site

on:
  push:
    branches: [main]
    # registry/** because the homepage's list and map are built from the council registry
    paths: [web/**, registry/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          # The script's public web app address, set once as a repository variable (Settings, Variables).
          VITE_SCRIPT_URL: ${{ vars.BIN_DAY_SCRIPT_URL }}
          # The GoatCounter count address (public: it is in the page). A repository variable GOATCOUNTER_URL overrides it;
          # setting that variable to a single space turns counting off.
          VITE_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL || 'https://binday.goatcounter.com/count' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
