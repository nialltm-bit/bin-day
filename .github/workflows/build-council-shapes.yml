name: Build council outlines

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/build-council-shapes.yml
      - scripts/build_council_shapes.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the outlines from the ONS boundaries
        run: python scripts/build_council_shapes.py web/public/data/council-shapes.json
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/council-shapes.json
          git commit -m "Update council outlines for the coverage map [skip ci]" || exit 0
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
