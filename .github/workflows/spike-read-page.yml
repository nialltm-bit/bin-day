name: Spike read a developer page

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-read-page.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List the InstaMaps API endpoints and pricing terms
        run: |
          UA="Mozilla/5.0 (compatible; bin-day-spike; +https://github.com/nialltm-bit/bin-day)"
          curl -sSL -m 30 -A "$UA" -w "openapi status %{http_code}\n" https://get-instamaps.com/openapi.json -o openapi.json
          python3 - <<'PY'
          import json
          d = json.load(open("openapi.json"))
          print(d.get("info", {}).get("title"), d.get("info", {}).get("version"))
          print((d.get("info", {}).get("description") or "")[:1500])
          for path, ops in d.get("paths", {}).items():
              for method, op in ops.items():
                  print(method.upper(), path, "|", (op.get("summary") or "")[:110])
          PY
          sleep 3
          curl -sSL -m 30 -A "$UA" -w "\npricing status %{http_code}\n" https://get-instamaps.com/pricing -o pricing.html
          python3 - <<'PY'
          import re
          h = open("pricing.html", encoding="utf-8", errors="replace").read()
          h = re.sub(r"(?is)<(script|style|svg)[^>]*>.*?</\1>", " ", h)
          t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", h))
          print(t[:2500])
          PY
