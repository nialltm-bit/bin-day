name: Spike read a developer page

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-read-page.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the text of the Property Passport developers page
        run: |
          UA="Mozilla/5.0 (compatible; bin-day-spike; +https://github.com/nialltm-bit/bin-day)"
          curl -sSL -m 30 -A "$UA" -w "\nstatus %{http_code}\n" https://www.propertypassport.uk/developers -o page.html
          python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8", errors="replace").read()
          h = re.sub(r"(?is)<(script|style|svg)[^>]*>.*?</\1>", " ", h)
          t = re.sub(r"<[^>]+>", " ", h)
          t = re.sub(r"\s+", " ", t)
          print(len(h), "bytes of html")
          print(t[:5000])
          PY
