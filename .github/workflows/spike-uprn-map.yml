name: Spike UPRN map data

on:
  push:
    branches: [claude/nifty-faraday-obdwan]
    paths:
      - .github/workflows/spike-uprn-map.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ITEM: 4198f5e0d6654d8a9661d0c15d4f912b
    steps:
      - name: Read the item's licence text and download details
        run: |
          set -u
          curl -sSL -m 60 "https://www.arcgis.com/sharing/rest/content/items/$ITEM?f=json" -o item.json
          python3 - <<'PY'
          import json, re
          d = json.load(open("item.json"))
          for k in ("title", "type", "size", "url", "access"):
              print(k, ":", d.get(k))
          print("licence:", re.sub(r"<[^>]+>", " ", d.get("licenseInfo") or "")[:1200])
          print("terms:", re.sub(r"<[^>]+>", " ", d.get("accessInformation") or "")[:600])
          PY
          echo "--- data headers"
          curl -sSIL -m 60 "https://www.arcgis.com/sharing/rest/content/items/$ITEM/data" | grep -i "^HTTP\|content-type\|content-length\|content-disposition" | head
